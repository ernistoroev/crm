<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CRM колледжа{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; color: #222; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; margin-bottom: 16px; padding-bottom: 8px; }
        header form { display: inline; }
        a { color: #1a5fb4; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
        .btn { display: inline-block; padding: 6px 12px; border: 1px solid #1a5fb4; border-radius: 4px; background: #1a5fb4; color: #fff; text-decoration: none; cursor: pointer; font: inherit; }
        .btn-light { background: #fff; color: #1a5fb4; }
        .btn-danger { background: #c01c28; border-color: #c01c28; }
        .errorlist { color: #c01c28; margin: 4px 0; padding-left: 16px; }
        form p { margin: 8px 0; }
        form label { display: inline-block; min-width: 220px; }
        img.photo { max-width: 200px; border-radius: 4px; }
    </style>
</head>
<body>
<header>
    <a href="{% url 'users:list' %}"><strong>CRM колледжа</strong></a>
    <div>
        {% if user.is_authenticated %}
            {{ user.username }}
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-light">Выйти</button>
            </form>
        {% else %}
            <a class="btn btn-light" href="{% url 'login' %}?next={{ request.path }}">Войти</a>
        {% endif %}
    </div>
</header>
{% block content %}{% endblock %}
</body>
</html>
