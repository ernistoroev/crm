{% extends 'users/base.html' %}

{% block title %}Удаление студента{% endblock %}

{% block content %}
<h1>Удалить студента?</h1>
<p>Вы действительно хотите удалить <strong>{{ student }}</strong>? Это действие нельзя отменить.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'users:detail' student.pk %}">Отмена</a>
</form>
{% endblock %}
